<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starw0rks by Sam.</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #020111; touch-action: none; }
        canvas { display: block; cursor: crosshair; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [], stars = [], flares = [], camera = { x: 0, y: 0 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < 150; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 0.8 + 0.2,
                    baseAlpha: Math.random(),
                    blinkSpeed: Math.random() * 0.05 + 0.01
                });
            }
        }

        window.addEventListener('resize', resize);
        resize();

        class FallingStar {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width * 1.5 - width * 0.25;
                this.y = -20;
                this.vx = 4 + Math.random() * 3;
                this.vy = 2 + Math.random() * 2;
                this.life = 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.005;
                if (this.y > height || this.life <= 0) this.reset();
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = "#FFF";
                ctx.beginPath();
                ctx.arc(this.x + camera.x, this.y + camera.y, 1, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        class Flare {
            constructor(targetX, targetY) {
                this.x = width / 2;
                this.y = height;
                this.tx = targetX;
                this.ty = targetY;
                this.angle = Math.atan2(this.ty - this.y, this.tx - this.x);
                this.speed = 15;
            }
            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                if (Math.hypot(this.x - this.tx, this.y - this.ty) < 20) {
                    createFirework(this.tx, this.ty);
                    return false;
                }
                return true;
            }
            draw() {
                let grad = ctx.createLinearGradient(this.x, this.y, this.x - 20, this.y + 20);
                grad.addColorStop(0, "#FFF");
                grad.addColorStop(1, "#FFD700");
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Particle {
            constructor(x, y, color, isBig) {
                this.x = x; this.y = y; this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * (isBig ? 8 : 4) + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1; this.decay = Math.random() * 0.015 + 0.005;
            }
            update() {
                this.vx *= 0.95; this.vy *= 0.95; this.vy += 0.1;
                this.x += this.vx; this.y += this.vy; this.alpha -= this.decay;
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = Math.random() > 0.5 ? this.color : "#FFF";
                ctx.beginPath();
                ctx.arc(this.x + camera.x, this.y + camera.y, Math.random() * 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createFirework(x, y) {
            const isBig = Math.random() > 0.5;
            const hue = Math.floor(Math.random() * 360);
            const color = `hsl(${hue}, 100%, 60%)`;
            for (let i = 0; i < 150; i++) particles.push(new Particle(x, y, color, isBig));
        }

        canvas.addEventListener('mousedown', (e) => flares.push(new Flare(e.clientX, e.clientY)));
        
        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                camera.x = (e.touches[0].clientX - width/2) * 0.1;
                camera.y = (e.touches[0].clientY - height/2) * 0.1;
            }
        });

        const fallingStars = [];
        setInterval(() => fallingStars.push(new FallingStar()), 10000);

        function animate() {
            ctx.fillStyle = 'rgba(2, 1, 17, 0.2)';
            ctx.fillRect(0, 0, width, height);
            
            // Draw Dynamic Background Stars
            stars.forEach((s, i) => {
                const alpha = Math.abs(Math.sin(Date.now() * 0.001 * s.blinkSpeed + i));
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.7 + 0.3})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            flares = flares.filter(f => f.update() && (f.draw(), true));
            particles = particles.filter(p => p.alpha > 0);
            particles.forEach(p => { p.update(); p.draw(); });
            fallingStars.forEach(fs => { fs.update(); fs.draw(); });
            
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
